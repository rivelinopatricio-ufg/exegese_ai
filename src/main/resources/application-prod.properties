# ==============================================================================
# Exegese AI - Production Profile (SPRING_PROFILES_ACTIVE=prod, set by docker-compose.yml)
# Format: Java Properties (Standardized Directive)
# Encoding: UTF-8
#
# application.properties is already production-safe (template cache on, INFO logs, no error details in
# responses, HttpOnly + Secure + SameSite=Lax session cookie, Flyway-owned schema). This file only holds
# overrides that must apply in production even if a development default changes; keep it minimal.
# Do NOT set server.forward-headers-strategy=framework here: the native strategy (Tomcat RemoteIpValve,
# trusted internal proxies only) is what keeps X-Forwarded-For from being spoofed.
# ==============================================================================

# Schema changes only through Flyway migrations; Hibernate never alters the database
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

# Session cookie only over HTTPS (TLS terminates at the reverse proxy)
server.servlet.session.cookie.secure=true

# No request details (parameters such as user questions) or SQL in the logs (LGPD)
logging.level.br.org.rivelino.exegese_ai=INFO
logging.level.org.hibernate.SQL=WARN
spring.mvc.log-request-details=false
