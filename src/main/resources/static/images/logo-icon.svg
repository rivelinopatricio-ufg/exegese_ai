<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield / Rounded Container -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="118" height="118" rx="25" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Balance Scales Beam (Justice & Regulatory Equilibrium) -->
  <path d="M 60 22 L 60 76 M 34 32 L 86 32 M 34 32 L 24 50 M 34 32 L 44 50 M 86 32 L 76 50 M 86 32 L 96 50" 
        stroke="url(#silverGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left Pan -->
  <path d="M 22 50 C 22 58 46 58 46 50 Z" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Right Pan -->
  <path d="M 74 50 C 74 58 98 58 98 50 Z" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Open Codex / Law Book (Exegetical Foundation) -->
  <path d="M 60 40 L 32 34 L 32 68 L 60 76 L 88 68 L 88 34 Z" 
        fill="#0b1329" stroke="url(#silverGrad)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Center Book Spine -->
  <line x1="60" y1="40" x2="60" y2="76" stroke="url(#cyanGrad)" stroke-width="2.5"/>

  <!-- Neural Network & Knowledge Graph Lattice inside Book (AI Exegesis) -->
  <g filter="url(#glow)">
    <!-- Connections -->
    <line x1="42" y1="44" x2="52" y2="52" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="52" y1="52" x2="44" y2="62" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="52" y1="52" x2="60" y2="56" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="60" y1="56" x2="68" y2="52" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="68" y1="52" x2="78" y2="44" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="68" y1="52" x2="76" y2="62" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Nodes -->
    <circle cx="42" cy="44" r="2.5" fill="#38bdf8"/>
    <circle cx="52" cy="52" r="3" fill="#ffffff"/>
    <circle cx="44" cy="62" r="2.5" fill="#38bdf8"/>
    <circle cx="60" cy="56" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="68" cy="52" r="3" fill="#ffffff"/>
    <circle cx="78" cy="44" r="2.5" fill="#38bdf8"/>
    <circle cx="76" cy="62" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Pedestal / Pillar Base -->
  <path d="M 52 76 L 68 76 M 46 80 L 74 80 M 42 84 L 78 84" 
        stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Accent Star / Exegesis Spark at Apex -->
  <circle cx="60" cy="20" r="2" fill="#38bdf8" filter="url(#glow)"/>
</svg>
