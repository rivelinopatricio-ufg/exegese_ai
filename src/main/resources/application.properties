# ==============================================================================
# Exegese AI - Application Production Configuration
# Format: Java Properties (Standardized Directive)
# Encoding: UTF-8
# ==============================================================================

# Server & Reverse Proxy Header Forwarding
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1

# Multipart File Upload Configuration (Aligned with Reverse Proxy 50MB limit)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# Application Identity & Threading
spring.application.name=exegese-ai
spring.threads.virtual.enabled=true

# Database Persistence (PostgreSQL 17 + pgvector)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exegese_db}
# Credentials have no built-in defaults: set SPRING_DATASOURCE_USERNAME/PASSWORD (or POSTGRES_USER/PASSWORD from .env)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# Custom External Configuration Import (app_config)
spring.config.import=optional:file:./app_config[.properties],optional:file:./app_config.properties,optional:file:./config/app_config[.properties],optional:file:./config/app_config.properties

# JPA & Hibernate Engine
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Internationalization (i18n) Resource Bundles
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.cache-duration=3600s

# Google OAuth2 / OIDC Client Registration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Spring AI Multi-Provider Defaults
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:dummy-gemini-key}
spring.ai.google.genai.project-id=${VERTEX_AI_PROJECT_ID:dummy-project}
spring.ai.google.genai.location=${VERTEX_AI_LOCATION:us-central1}
cerebras.api-key=${CEREBRAS_API_KEY:}

# Local Ollama provider (docker-compose.override.ai*.yml): base URL and chat model pulled by ollama_init.sh
exegese.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
exegese.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}

# AES-256-GCM master key for API keys stored in the database (mandatory, no default).
# Base64 of exactly 32 random bytes: openssl rand -base64 32 (install.sh generates it into .env)
exegese.security.crypto-key=${EXEGESE_AES_SECRET:}

# Google login policy: comma-separated e-mail domains allowed to sign in (empty = any verified Google account)
exegese.security.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}
# How long the active flag / role of an account is cached between database checks on each request
exegese.security.account-status-cache-ttl=30s

# Exegese AI Business Domain Defaults
# Google account e-mail promoted to ROLE_ADMIN on login while no administrator exists yet (no default:
# when INITIAL_ADMIN_EMAIL is empty a warning is logged and nobody is promoted automatically)
exegese.initial-admin-email=${INITIAL_ADMIN_EMAIL:}
exegese.upload-dir=${UPLOAD_DIR:./uploads}
exegese.embedding-model=text-embedding-004
exegese.default-llm-provider=GEMINI
exegese.similarity-threshold=0.65

# Actuator Health & Diagnostics Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging Hierarchy
logging.level.root=INFO
logging.level.br.org.rivelino.exegese_ai=DEBUG
