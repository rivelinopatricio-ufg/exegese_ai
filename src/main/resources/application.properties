# ==============================================================================
# Exegese AI - Application Production Configuration
# Format: Java Properties (Standardized Directive)
# Encoding: UTF-8
#
# The defaults below are production-safe (template cache on, INFO logs, no error details, Secure session
# cookie). For local development (e.g. Eclipse) override them in the git-ignored
# src/main/resources/application-dev.properties and run with the "dev" profile:
#   server.servlet.session.cookie.secure=false   (only when serving plain http://localhost; with the dev
#                                                  TLS keystore classpath:cert.p12 keep it true)
#   spring.thymeleaf.cache=false
#   logging.level.br.org.rivelino.exegese_ai=DEBUG
# Never log the content of user questions (LGPD): application code logs only lengths, ids and references.
# ==============================================================================

# Server & Reverse Proxy Header Forwarding
server.port=${PORT:8080}
# NATIVE = Tomcat RemoteIpValve: X-Forwarded-* are honored only from the internal proxies below, so a client
# cannot spoof its IP (rate limiting) or scheme. The FRAMEWORK strategy would trust these headers from anyone.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1

# Error responses never expose exception messages, stack traces or binding details to the client
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Session cookie: not readable by scripts, sent only over HTTPS and not on cross-site sub-requests
# (Lax keeps the top-level redirect back from Google OAuth2 working)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Multipart File Upload Configuration (Aligned with Reverse Proxy 50MB limit)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# Application Identity & Threading
spring.application.name=exegese-ai
spring.threads.virtual.enabled=true

# Database Persistence (PostgreSQL 17 + pgvector)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exegese_db}
# Credentials have no built-in defaults: set SPRING_DATASOURCE_USERNAME/PASSWORD (or POSTGRES_USER/PASSWORD from .env)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# Custom External Configuration Import (app_config)
spring.config.import=optional:file:./app_config[.properties],optional:file:./app_config.properties,optional:file:./config/app_config[.properties],optional:file:./config/app_config.properties

# JPA & Hibernate Engine: the schema is owned by Flyway (src/main/resources/db/migration), never by Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Flyway schema migrations. Databases created before Flyway (init-schema.sql / Hibernate ddl-auto=update)
# are baselined at version 1, so they skip V1__baseline.sql and only run the idempotent V2+ migrations.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-disabled=true

# Thymeleaf Template Engine
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Internationalization (i18n) Resource Bundles
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.cache-duration=3600s

# Google OAuth2 / OIDC Client Registration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# LLM providers: chat completions use the application's own LlmClientService (no Spring AI chat model)
spring.ai.model.chat=none
# Gemini key used for chat when no key was saved in the admin panel (OpenAI/Anthropic/... read their *_API_KEY)
exegese.gemini.api-key=${GEMINI_API_KEY:}
cerebras.api-key=${CEREBRAS_API_KEY:}
# Extra hosts allowed as LLM base URLs, comma-separated: "host" (any cloud provider) or "PROVIDER=host".
# Defaults: each provider's official API host; OLLAMA_LOCAL also accepts http to the exegese.ollama.base-url host.
exegese.llm.allowed-hosts=${LLM_ALLOWED_HOSTS:}

# Text embeddings (semantic search): Google Gemini via the Gemini Developer API key. Output dimensionality must
# match the VECTOR(768) column of exegese_chunk. Without a key the app runs with full-text search only.
exegese.embedding.api-key=${GEMINI_API_KEY:}
exegese.embedding-model=gemini-embedding-001
exegese.embedding.dimensions=768
exegese.embedding.batch-size=${EMBEDDING_BATCH_SIZE:16}
# Pace of the background embedding job (ingestion and reindex), shared by every run. Defaults stay below the
# Gemini free-tier quota per minute and leave room for chat queries; raise them for a paid quota tier.
# Tokens are estimated as characters / 4.
exegese.embedding.requests-per-minute=${EMBEDDING_REQUESTS_PER_MINUTE:90}
exegese.embedding.tokens-per-minute=${EMBEDDING_TOKENS_PER_MINUTE:25000}
# Quota refusals (HTTP 429): the job waits (the provider's suggested delay or an exponential backoff up to
# max-backoff) and retries the same batch; after max-quota-wait without progress (e.g. a daily quota) it pauses.
exegese.embedding.initial-backoff=PT15S
exegese.embedding.max-backoff=PT5M
exegese.embedding.max-quota-wait=PT30M
# Pending embeddings (new uploads, paused or interrupted runs) are resumed automatically at this interval.
exegese.embedding.resume-enabled=true
exegese.embedding.resume-interval=PT15M

# Local Ollama provider (docker-compose.override.ai*.yml): base URL and chat model pulled by ollama_init.sh
exegese.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
exegese.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}

# AES-256-GCM master key for API keys stored in the database (mandatory, no default).
# Base64 of exactly 32 random bytes: openssl rand -base64 32 (install.sh generates it into .env)
exegese.security.crypto-key=${EXEGESE_AES_SECRET:}

# Google login policy: comma-separated e-mail domains allowed to sign in (empty = any verified Google account)
exegese.security.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}
# With an allowlist, also require the Google account to be managed by that Google Workspace domain (hd claim
# equal to the e-mail domain). Set to false only when the domain's mail is not hosted on Google Workspace.
exegese.security.require-hosted-domain=${REQUIRE_HOSTED_DOMAIN:true}
# How long the active flag / role of an account is cached between database checks on each request
exegese.security.account-status-cache-ttl=30s
# Requests per minute allowed on /api/** per authenticated account (or per client IP when anonymous)
exegese.security.rate-limit.requests-per-minute=20
# Chat answers a single user may have in flight at the same time (pending stream tickets included)
exegese.chat.max-concurrent-streams-per-user=2
# Lifetime of the single-use ticket issued by POST /api/chat/messages to open GET /api/chat/stream/{id}
exegese.chat.stream-ticket-ttl=2m

# Exegese AI Business Domain Defaults
# Google account e-mail promoted to ROLE_ADMIN on login while no administrator exists yet (no default:
# when INITIAL_ADMIN_EMAIL is empty a warning is logged and nobody is promoted automatically)
exegese.initial-admin-email=${INITIAL_ADMIN_EMAIL:}
# Original uploaded PDFs are kept here as <sha256>.pdf (docker: the upload_data volume at /app/uploads)
exegese.upload-dir=${UPLOAD_DIR:./uploads}
# PDFs with more pages are refused; at most max-concurrent documents are processed in the background at once
exegese.ingestion.max-pages=2000
exegese.ingestion.max-concurrent=2
exegese.default-llm-provider=GEMINI
# Grounding evidence required by the anti-hallucination guard: best vector cosine similarity (1 - pgvector
# cosine distance) at least this value, or a full-text match of every term, or a lexical score at least this value
exegese.similarity-threshold=0.65
exegese.min-lexical-score=4.0

# Actuator Health & Diagnostics Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging Hierarchy (INFO in production: DEBUG is for development only)
logging.level.root=INFO
logging.level.br.org.rivelino.exegese_ai=INFO
