<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exegese AI — Gestão de Usuários</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-slate-900 text-slate-100 p-8">
    <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-700">
        <div>
            <h1 class="text-2xl font-bold">Painel Administrativo</h1>
            <p class="text-slate-400 text-sm">Gestão de Usuários e Governança de Acesso</p>
        </div>
        <div class="flex gap-4">
            <a th:href="@{/}" class="text-sky-400 hover:underline">Voltar ao Chat</a>
            <a th:href="@{/logout}" class="text-red-400 hover:underline">Sair</a>
        </div>
    </header>

    <main class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
        <h2 class="text-xl font-semibold mb-4">Usuários Cadastrados</h2>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="border-b border-slate-700 text-slate-400 text-sm">
                    <th class="py-3 px-4">Nome</th>
                    <th class="py-3 px-4">E-mail</th>
                    <th class="py-3 px-4">Papel (Role)</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4">Último Acesso</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}" class="border-b border-slate-700/50 hover:bg-slate-750">
                    <td class="py-3 px-4 font-medium" th:text="${user.name}">Nome</td>
                    <td class="py-3 px-4 text-slate-300" th:text="${user.email}">email@dominio.com</td>
                    <td class="py-3 px-4">
                        <span class="px-2 py-1 text-xs rounded bg-sky-900/60 text-sky-200" th:text="${user.role}">ROLE_USER</span>
                    </td>
                    <td class="py-3 px-4">
                        <span th:if="${user.active}" class="text-emerald-400 text-sm">Ativo</span>
                        <span th:unless="${user.active}" class="text-red-400 text-sm">Inativo</span>
                    </td>
                    <td class="py-3 px-4 text-sm text-slate-400" th:text="${user.lastLoginAt != null ? user.lastLoginAt : '-'}">-</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
