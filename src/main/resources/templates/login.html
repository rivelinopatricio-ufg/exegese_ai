<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.page.title}">Exegese AI — Acesso Institucional</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700 text-center">
        <!-- Brand Header with Official Logo -->
        <div class="mb-5">
            <div class="w-20 h-20 mx-auto mb-3 rounded-2xl overflow-hidden shadow-xl shadow-sky-950/60 border border-sky-500/40 bg-slate-900 p-0.5">
                <img th:src="@{/images/logo.png}" alt="Exegese AI Logo" class="w-full h-full object-cover rounded-xl">
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight" th:text="#{login.header.title}">Exegese AI</h1>
            <p class="text-slate-400 text-sm mt-1" th:text="#{login.header.subtitle}">Plataforma RAG de Rigor Exegético e Grounding Normativo</p>
        </div>

        <!-- Language Selector (Pre-Login) -->
        <div class="mb-6 flex items-center justify-center gap-1.5 p-1 bg-slate-900/90 rounded-lg border border-slate-700/80 max-w-xs mx-auto" role="group" th:aria-label="#{lang.selector.label}">
            <a th:href="@{/login(lang='pt_BR')}"
               th:classappend="${#locale.language == 'pt' ? 'bg-sky-600 text-white font-semibold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800'}"
               class="flex-1 py-1 px-2 rounded-md text-xs transition duration-150 text-center flex items-center justify-center gap-1">
                <span>🇧🇷</span>
                <span th:text="#{lang.pt_BR}">Português</span>
            </a>
            <a th:href="@{/login(lang='en')}"
               th:classappend="${#locale.language == 'en' ? 'bg-sky-600 text-white font-semibold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800'}"
               class="flex-1 py-1 px-2 rounded-md text-xs transition duration-150 text-center flex items-center justify-center gap-1">
                <span>🇺🇸</span>
                <span th:text="#{lang.en}">English</span>
            </a>
            <a th:href="@{/login(lang='es')}"
               th:classappend="${#locale.language == 'es' ? 'bg-sky-600 text-white font-semibold shadow' : 'text-slate-400 hover:text-white hover:bg-slate-800'}"
               class="flex-1 py-1 px-2 rounded-md text-xs transition duration-150 text-center flex items-center justify-center gap-1">
                <span>🇪🇸</span>
                <span th:text="#{lang.es}">Español</span>
            </a>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${loginErrorKey}" class="mb-4 p-3 rounded bg-red-900/50 border border-red-700 text-red-200 text-sm" th:text="#{${loginErrorKey}}">
            Falha na autenticação corporativa. Tente novamente.
        </div>

        <div th:if="${param.logout}" class="mb-4 p-3 rounded bg-emerald-900/50 border border-emerald-700 text-emerald-200 text-sm" th:text="#{login.alert.logout}">
            Sessão encerrada com sucesso.
        </div>

        <!-- Google OAuth2 Action -->
        <div class="space-y-4">
            <a th:href="@{/oauth2/authorization/google}" 
               class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-white text-slate-900 font-semibold rounded-lg shadow-md hover:bg-slate-100 transition duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span th:text="#{login.button.google}">Entrar com Google</span>
            </a>
        </div>

        <!-- Compliance & Security Notice -->
        <div class="mt-8 text-xs text-slate-500 border-t border-slate-700/60 pt-4" th:text="#{login.footer.notice}">
            Acesso restrito e auditado. Em conformidade com a LGPD e padrões de segurança corporativa.
        </div>
    </div>
</body>
</html>
