# ==============================================================================
# Exegese AI - Application Test Configuration (Profile: test)
# Format: Java Properties (Standardized Directive)
# Encoding: UTF-8
# ==============================================================================

server.port=0

spring.application.name=exegese-ai-test

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# In-memory H2 Database for Isolated Integration Tests
spring.datasource.url=jdbc:h2:mem:exegese_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate Test Settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Test OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Internationalization (i18n) Resource Bundles
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Disable External Live AI Autoconfigurations During Tests
spring.autoconfigure.exclude=\
  org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageAutoConfiguration,\
  org.springframework.ai.model.google.genai.autoconfigure.image.GoogleGenAiImageConnectionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration,\
  org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Exegese AI Business Configuration
exegese.initial-admin-email=bootstrap.admin@exegese.test
exegese.upload-dir=./target/test-uploads
exegese.embedding-model=text-embedding-004
exegese.default-llm-provider=GEMINI
exegese.similarity-threshold=0.65
cerebras.api-key=

# Fixed AES-256 master key for tests only (Base64 of 32 bytes); never use it outside the test profile
exegese.security.crypto-key=dGVzdC1vbmx5LWFlcy1rZXktMzItYnl0ZXMtbG9uZyE=

# Google login policy and account status cache: open to any verified account; no caching, so that tests
# sharing the in-memory database never observe an account state cached by another test
exegese.security.allowed-email-domains=
exegese.security.account-status-cache-ttl=0s

# Logging Levels for Test Execution
logging.level.root=WARN
logging.level.br.org.rivelino.exegese_ai=DEBUG
