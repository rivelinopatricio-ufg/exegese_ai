# Optional file for local Ollama service execution with NVIDIA GPU acceleration
# Usage: docker compose -f docker-compose.yml -f docker-compose.override.ai-with-gpu.yml up -d
# Ollama has no authentication, so its port is NOT published: the app reaches it as
# http://ollama:11434 on the internal exegese-net network (Docker-published ports bypass UFW).
# The chat model pulled on startup is OLLAMA_CHAT_MODEL (default: llama3.2); select the
# "Ollama Local" provider in the admin panel to use it.
services:
  ollama:
    container_name: exegese_ollama
    image: ollama/ollama:0.40.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama_init.sh:/ollama_init.sh:ro
    entrypoint: ["/usr/bin/bash", "/ollama_init.sh"]
    networks:
      - exegese-net
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local
