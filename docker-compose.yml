version: "3.8"
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: exegese_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exegese_db}
      POSTGRES_USER: ${POSTGRES_USER:-exegese_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exegese_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: exegese_ai:latest
    container_name: exegese_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exegese_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exegese_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exegese_password}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
