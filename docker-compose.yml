# ==============================================================================
# Exegese AI - Production Multi-Container Orchestration
# Services: PostgreSQL 17 + PGVector, Spring Boot 4.1.1, SWAG Reverse Proxy
# ==============================================================================

version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exegese_db}
      POSTGRES_USER: ${POSTGRES_USER:-exegese_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exegese_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exegese_user} -d ${POSTGRES_DB:-exegese_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - exegese-net
    restart: unless-stopped

  app:
    image: br.org.rivelino/exegese-ai:latest
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    # Port 8080 is isolated on the internal network exegese-net and exposed only to the proxy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exegese_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exegese_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exegese_password}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@exegese.ai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      EXEGESE_AES_SECRET: ${EXEGESE_AES_SECRET:-}
    volumes:
      - storage_data:/app/storage
      - upload_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exegese-net
    restart: unless-stopped

  proxy:
    image: br.org.rivelino/exegese-ai-proxy:latest
    container_name: proxy
    build:
      context: ./docker/proxy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - URL=${SERVER_NAME:-exegese-ai.sytes.net}
      - SUBDOMAINS=
      - VALIDATION=${VALIDATION:-http}
      - EMAIL=${LETSENCRYPT_EMAIL:-admin@exegese.ai}
      - STAGING=${LETSENCRYPT_STAGING:-false}
    cap_add:
      - NET_ADMIN
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    volumes:
      - proxy_config:/config
      - ./docker/proxy/config/default:/config/nginx/site-confs/default
    depends_on:
      app:
        condition: service_healthy
    networks:
      - exegese-net
    restart: always

networks:
  exegese-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  storage_data:
    driver: local
  upload_data:
    driver: local
  proxy_config:
    driver: local
