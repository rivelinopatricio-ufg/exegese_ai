version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: exegese-ai-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exegese_db}
      POSTGRES_USER: ${POSTGRES_USER:-exegese_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exegese_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exegese_user} -d ${POSTGRES_DB:-exegese_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - exegese-net
    restart: unless-stopped

  app:
    image: br.org.rivelino/exegese-ai:latest
    container_name: exegese-ai-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-exegese_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-exegese_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-exegese_password}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@exegese.ai}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      EXEGESE_AES_SECRET: ${EXEGESE_AES_SECRET:-}
    volumes:
      - storage_data:/app/storage
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - exegese-net
    restart: unless-stopped

networks:
  exegese-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  storage_data:
    driver: local
  upload_data:
    driver: local

